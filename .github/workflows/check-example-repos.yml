name: Check Example Repos

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-example-repos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify every linked example repo is live and not archived
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          errors=0
          repos=$(grep -oE '\]\(https://github\.com/[^)]+\)' skills/fastly-reference-architectures/references/examples.md \
            | sed -E 's#\]\(https://github\.com/([^)]+)\)#\1#')
          for repo in $repos; do
            echo "Checking $repo..."
            if ! info=$(gh api "repos/$repo" 2>&1); then
              echo "::error::$repo is unreachable (removed, renamed, or private)"
              errors=$((errors + 1))
              continue
            fi
            if [[ "$(echo "$info" | jq -r '.archived')" == "true" ]]; then
              echo "::error::$repo is archived"
              errors=$((errors + 1))
            fi
          done
          if [[ $errors -gt 0 ]]; then
            echo "Error: $errors example repo(s) failed the liveness check" >&2
            exit 1
          fi
